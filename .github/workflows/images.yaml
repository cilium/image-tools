name: Images
on:
  pull_request: {}
  push:
    branches: [main]

# Cancel superseded runs for the same PR, never cancel push-to-main builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  generate-images-matrix:
    name: images matrix
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.generate-images-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Generate images matrix
        id: generate-images-matrix
        run: echo "matrix=$(ls images | jq -R . | jq -sc '{images:.}')" | tee $GITHUB_OUTPUT

  build-images:
    name: ${{ matrix.image }} image
    needs: generate-images-matrix
    permissions:
      contents: read
      # Required by the Quay OIDC token exchange in the called workflow.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.generate-images-matrix.outputs.matrix).images }}
    uses: ./.github/workflows/build-image.yaml
    with:
      image: ${{ matrix.image }}

  # Single job to mark as required for merge, as matrix job names depend on
  # the list of images.
  images-result:
    name: images result
    runs-on: ubuntu-26.04
    if: always()
    needs:
      - generate-images-matrix
      - build-images
    steps:
      - name: Check all images jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          echo "${NEEDS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "${NEEDS}" | jq -e 'all(.[]; .result == "success")' >/dev/null
