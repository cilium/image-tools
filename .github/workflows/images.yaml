name: Images
on:
  pull_request: {}
  push:
    branches: [main]

# Cancel superseded runs for the same PR, never cancel push-to-main builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  generate-images-matrix:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.generate-images-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Generate images matrix
        id: generate-images-matrix
        run: echo "matrix=$(ls images | jq -R . | jq -sc '{images:.}')" | tee $GITHUB_OUTPUT

  build-and-push:
    name: ${{ github.event_name == 'push' && 'Build and push' || 'Build' }} ${{ matrix.image }} image
    runs-on: oracle-vm-32cpu-128gb-x86-64
    needs: generate-images-matrix
    permissions:
      contents: read
      # Required by the Quay OIDC token exchange.
      id-token: write
    # Pins the OIDC token subject to
    # repo:cilium/image-tools:environment:release, which is the identity
    # federated with the Quay robot account.
    environment:
      name: release
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.generate-images-matrix.outputs.matrix).images }}
    timeout-minutes: 720
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Set up job variables
        id: vars
        run: |
          if [ ${{ github.event.issue.pull_request || github.event.pull_request }} ]; then
            echo "push=false" >> $GITHUB_OUTPUT
          else
            echo "push=true" >> $GITHUB_OUTPUT
          fi

          if [[ -d images/${{ matrix.image }}/test ]]; then
            echo "test=true" >> $GITHUB_OUTPUT
          else
            echo "test=false" >> $GITHUB_OUTPUT
          fi

          IMAGE_TAG=$(scripts/make-image-tag.sh images/${{ matrix.image }})
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

          # Map image directory name to image name
          case "${{ matrix.image }}" in
            bpftool) IMAGE_NAME="cilium-bpftool" ;;
            checkpatch) IMAGE_NAME="cilium-checkpatch" ;;
            compilers) IMAGE_NAME="image-compilers" ;;
            iptables) IMAGE_NAME="iptables" ;;
            llvm) IMAGE_NAME="cilium-llvm" ;;
            maker) IMAGE_NAME="image-maker" ;;
            network-perf) IMAGE_NAME="network-perf" ;;
            startup-script) IMAGE_NAME="startup-script" ;;
            tester) IMAGE_NAME="image-tester" ;;
            *) IMAGE_NAME="${{ matrix.image }}" ;;
          esac
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

          # Check if image exists in registry
          if docker buildx imagetools inspect "quay.io/cilium/${IMAGE_NAME}:${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "Image ${IMAGE_NAME}:${IMAGE_TAG} already exists in registry"
            echo "build=false" >> $GITHUB_OUTPUT
          else
            echo "Will build ${IMAGE_NAME}:${IMAGE_TAG} as it's not present in registry"
            echo "build=true" >> $GITHUB_OUTPUT
          fi

          cat $GITHUB_OUTPUT

      # Quay's registry endpoint only accepts credentials or a JWT signed by
      # Quay itself, so the GitHub OIDC token cannot be used as the registry
      # password directly. Trade it for a short lived robot token first.
      #
      # Because the job references an environment, the subject of the token is
      # repo:cilium@21054566/image-tools@261141237:environment:release, the
      # immutable form that carries the owner and repository ids. That is the
      # identity federated with the robot account on the Quay side, so renaming
      # the environment breaks the login.
      - name: Get a quay.io robot token via OIDC
        id: registry-token
        if: steps.vars.outputs.build == 'true' && steps.vars.outputs.push == 'true'
        env:
          ROBOT: ${{ vars.QUAY_ROBOT_RELEASE }}
        run: |
          oidc_token="$(curl -sSf --retry 3 --retry-all-errors \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=quay.io" \
            | jq -er '.value')"
          echo "::add-mask::${oidc_token}"

          # Pass the credentials on stdin so that the OIDC token is not visible
          # in the process list of the runner.
          robot_token="$(printf 'user = "%s:%s"\n' "${ROBOT}" "${oidc_token}" \
            | curl -sSf --retry 3 --retry-all-errors -K - \
              "https://quay.io/oauth2/federation/robot/token" \
            | jq -er '.token')"
          echo "::add-mask::${robot_token}"

          echo "token=${robot_token}" >> "$GITHUB_OUTPUT"

      - name: Login to quay.io
        if: steps.vars.outputs.build == 'true' && steps.vars.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ vars.QUAY_ROBOT_RELEASE }}
          password: ${{ steps.registry-token.outputs.token }}

      - name: ${{ steps.vars.outputs.push == 'true' && 'Build and push' || 'Build' }} image
        if: steps.vars.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: images/${{ matrix.image }}
          file: images/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: ${{ steps.vars.outputs.push }}
          tags: quay.io/cilium/${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.image_tag }}

      - name: Test image
        if: steps.vars.outputs.build == 'true' && steps.vars.outputs.test == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: images/${{ matrix.image }}
          file: images/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: false
          target: test
